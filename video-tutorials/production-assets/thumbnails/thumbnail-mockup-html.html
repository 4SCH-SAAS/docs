<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4SCH Video Thumbnail Mockup Generator</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Poppins', sans-serif;
            background: #f5f5f5;
            padding: 20px;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2e8555;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
            padding: 20px;
            background: #f9f9f9;
            border-radius: 8px;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
            font-size: 14px;
        }
        input, select {
            padding: 10px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Poppins', sans-serif;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #2e8555;
        }
        .thumbnail-preview {
            position: relative;
            width: 1280px;
            height: 720px;
            margin: 0 auto;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 40px rgba(0,0,0,0.2);
        }
        .thumbnail-bg {
            position: absolute;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #1a1a2e 0%, #16213e 100%);
        }
        .logo {
            position: absolute;
            top: 40px;
            left: 40px;
            font-size: 36px;
            font-weight: 700;
            color: white;
            opacity: 0.9;
        }
        .logo img {
            height: 60px;
            width: auto;
        }
        .main-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 200px;
            opacity: 0.15;
        }
        .content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 90%;
        }
        .title {
            font-size: 84px;
            font-weight: 700;
            color: white;
            margin-bottom: 20px;
            text-shadow: 4px 4px 8px rgba(0,0,0,0.6);
            line-height: 1.1;
        }
        .subtitle-text {
            font-size: 44px;
            font-weight: 500;
            color: #e0e0e0;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        .badge {
            position: absolute;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 24px;
        }
        .duration-badge {
            bottom: 30px;
            right: 30px;
            background: #2e8555;
            color: white;
        }
        .chapter-badge {
            bottom: 30px;
            right: 170px;
            background: rgba(255,255,255,0.1);
            color: white;
            border: 2px solid white;
            font-weight: 600;
            font-size: 22px;
        }
        .series-badge {
            bottom: 30px;
            left: 30px;
            background: #16213e;
            color: #e0e0e0;
            font-weight: 500;
            font-size: 20px;
        }
        .download-btn {
            margin-top: 30px;
            padding: 15px 40px;
            background: #2e8555;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
        }
        .download-btn:hover {
            background: #1d5438;
        }
        .presets {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }
        .preset-btn {
            padding: 8px 16px;
            background: #e0e0e0;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            font-weight: 500;
        }
        .preset-btn:hover {
            background: #2e8555;
            color: white;
        }
        @media (max-width: 1400px) {
            .thumbnail-preview {
                transform: scale(0.7);
                transform-origin: top center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 4SCH Video Thumbnail Mockup Generator</h1>
        <p class="subtitle">Customize and preview YouTube thumbnail designs for 4SCH video tutorials</p>

        <div class="presets">
            <button class="preset-btn" onclick="loadPreset('intro')">Intro Series</button>
            <button class="preset-btn" onclick="loadPreset('admin')">School Admin</button>
            <button class="preset-btn" onclick="loadPreset('teacher')">Teacher Guide</button>
            <button class="preset-btn" onclick="loadPreset('parent')">Parent Guide</button>
            <button class="preset-btn" onclick="loadPreset('student')">Student Guide</button>
            <button class="preset-btn" onclick="loadPreset('feature')">Feature Deep Dive</button>
            <button class="preset-btn" onclick="loadPreset('support')">Support</button>
        </div>

        <div class="controls">
            <div class="control-group">
                <label for="title">Video Title</label>
                <input type="text" id="title" value="System Overview" oninput="updateThumbnail()">
            </div>
            <div class="control-group">
                <label for="subtitle">Subtitle</label>
                <input type="text" id="subtitle" value="School Management Made Simple" oninput="updateThumbnail()">
            </div>
            <div class="control-group">
                <label for="duration">Duration</label>
                <input type="text" id="duration" value="6 MIN" oninput="updateThumbnail()">
            </div>
            <div class="control-group">
                <label for="chapters">Chapters (optional)</label>
                <input type="text" id="chapters" value="" placeholder="e.g., 5 CHAPTERS" oninput="updateThumbnail()">
            </div>
            <div class="control-group">
                <label for="series">Series Badge</label>
                <input type="text" id="series" value="INTRO • 1 OF 3" oninput="updateThumbnail()">
            </div>
            <div class="control-group">
                <label for="icon">Icon/Emoji</label>
                <input type="text" id="icon" value="🎓" oninput="updateThumbnail()">
            </div>
            <div class="control-group">
                <label for="bgColor1">Background Color 1</label>
                <input type="color" id="bgColor1" value="#2e8555" oninput="updateThumbnail()">
            </div>
            <div class="control-group">
                <label for="bgColor2">Background Color 2</label>
                <input type="color" id="bgColor2" value="#1d5438" oninput="updateThumbnail()">
            </div>
        </div>

        <div class="thumbnail-preview" id="thumbnail">
            <div class="thumbnail-bg"></div>
            <div class="logo" id="logoContainer">
                <!-- Will use actual logo when available, fallback to text -->
                <img id="logoImg" src="../branding/logos/4sch-logo-white.png" 
                     alt="4SCH Logo" 
                     onerror="this.style.display='none'; document.getElementById('logoText').style.display='block';">
                <span id="logoText" style="display:none;">4SCH</span>
            </div>
            <div class="main-icon" id="mainIcon">🎓</div>
            <div class="content">
                <div class="title" id="titleText">System Overview</div>
                <div class="subtitle-text" id="subtitleText">School Management Made Simple</div>
            </div>
            <div class="badge duration-badge" id="durationBadge">6 MIN</div>
            <div class="badge chapter-badge" id="chapterBadge" style="display:none;"></div>
            <div class="badge series-badge" id="seriesBadge">INTRO • 1 OF 3</div>
        </div>

        <center>
            <button class="download-btn" onclick="downloadThumbnail()">📥 Download as Image (Right-click → Save)</button>
            <p style="margin-top: 15px; color: #666; font-size: 14px;">
                Note: For production, use actual design software. This is a mockup preview only.
            </p>
        </center>
    </div>

    <script>
        function updateThumbnail() {
            const title = document.getElementById('title').value;
            const subtitle = document.getElementById('subtitle').value;
            const duration = document.getElementById('duration').value;
            const chapters = document.getElementById('chapters').value;
            const series = document.getElementById('series').value;
            const icon = document.getElementById('icon').value;
            const bgColor1 = document.getElementById('bgColor1').value;
            const bgColor2 = document.getElementById('bgColor2').value;

            document.getElementById('titleText').textContent = title;
            document.getElementById('subtitleText').textContent = subtitle;
            document.getElementById('durationBadge').textContent = duration;
            document.getElementById('seriesBadge').textContent = series;
            document.getElementById('mainIcon').textContent = icon;

            const bg = document.querySelector('.thumbnail-bg');
            bg.style.background = `linear-gradient(45deg, ${bgColor1} 0%, ${bgColor2} 100%)`;

            const chapterBadge = document.getElementById('chapterBadge');
            if (chapters) {
                chapterBadge.textContent = chapters;
                chapterBadge.style.display = 'block';
            } else {
                chapterBadge.style.display = 'none';
            }
        }

        function loadPreset(type) {
            const presets = {
                intro: {
                    title: 'System Overview',
                    subtitle: 'School Management Made Simple',
                    duration: '6 MIN',
                    chapters: '',
                    series: 'INTRO • 1 OF 3',
                    icon: '🎓',
                    bgColor1: '#2e8555',
                    bgColor2: '#1d5438'
                },
                admin: {
                    title: 'School Administrator Guide',
                    subtitle: 'Complete Setup & Management',
                    duration: '22 MIN',
                    chapters: '5 CHAPTERS',
                    series: 'ROLE-BASED',
                    icon: '👨‍💼',
                    bgColor1: '#ff6b6b',
                    bgColor2: '#c44545'
                },
                teacher: {
                    title: "Teacher's Guide",
                    subtitle: 'Attendance, Grading & More',
                    duration: '20 MIN',
                    chapters: '4 CHAPTERS',
                    series: 'ROLE-BASED',
                    icon: '👩‍🏫',
                    bgColor1: '#4ecdc4',
                    bgColor2: '#309a92'
                },
                parent: {
                    title: "Parent's Guide",
                    subtitle: "Monitor Your Child's Progress",
                    duration: '13 MIN',
                    chapters: '3 CHAPTERS',
                    series: 'ROLE-BASED',
                    icon: '👨‍👩‍👧',
                    bgColor1: '#ffd93d',
                    bgColor2: '#d4a613'
                },
                student: {
                    title: "Student's Guide",
                    subtitle: 'Assignments, Grades & Timetable',
                    duration: '11 MIN',
                    chapters: '3 CHAPTERS',
                    series: 'ROLE-BASED',
                    icon: '🎒',
                    bgColor1: '#6bcf7f',
                    bgColor2: '#4a9d5a'
                },
                feature: {
                    title: 'Fee Management',
                    subtitle: '& Payment Processing',
                    duration: '9 MIN',
                    chapters: '',
                    series: 'DEEP DIVE',
                    icon: '💰',
                    bgColor1: '#1a1a2e',
                    bgColor2: '#16213e'
                },
                support: {
                    title: 'Common Issues',
                    subtitle: 'Quick Solutions',
                    duration: '9 MIN',
                    chapters: '',
                    series: 'SUPPORT • TROUBLESHOOTING',
                    icon: '🔧',
                    bgColor1: '#2e8555',
                    bgColor2: '#1d5438'
                }
            };

            const preset = presets[type];
            if (preset) {
                document.getElementById('title').value = preset.title;
                document.getElementById('subtitle').value = preset.subtitle;
                document.getElementById('duration').value = preset.duration;
                document.getElementById('chapters').value = preset.chapters;
                document.getElementById('series').value = preset.series;
                document.getElementById('icon').value = preset.icon;
                document.getElementById('bgColor1').value = preset.bgColor1;
                document.getElementById('bgColor2').value = preset.bgColor2;
                updateThumbnail();
            }
        }

        function downloadThumbnail() {
            alert('To download:\n\n1. Right-click on the thumbnail preview\n2. Select "Save Image As..."\n3. Save as PNG or JPG\n\nFor production quality, use Figma/Photoshop with the design guide provided.');
        }

        // Initialize
        updateThumbnail();
    </script>
</body>
</html>
