name: Link Check
on:
  pull_request:
  push:
    branches: [ main ]
  schedule:
    - cron: '0 3 * * 1'  # Every Monday at 03:00 UTC

jobs:
  link-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check links in markdown files
        uses: lycheeverse/lychee-action@v1
        with:
          args: |
            --exclude "localhost"
            --verbose
            --no-progress
            --exclude-mail
            --max-concurrency 4
            --retry-wait-time 2
            --timeout 20
            **/*.md **/*.mdx
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'

      - name: Setup pnpm
        run: |
          corepack enable
          corepack prepare pnpm@latest --activate
          pnpm config set ignore-scripts false

      - name: Get pnpm store directory
        id: pnpm-store
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-v3-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-v3-

      - name: Prune PNPM store
        run: pnpm store prune

      - name: Install dependencies
        # Allow ignored builds (pnpm v10+ treats ignored build scripts as error by default)
        # We rebuild sharp manually in the next step, so it's safe to ignore here.
        run: pnpm install --frozen-lockfile --config.confirmModulesPurge=false
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1
          # Pin to pnpm v9 to avoid v10+ build-script error behavior
          # Or set this to silence the ignored builds error in v10+
          PNPM_IGNORE_BUILDS_WARNING: 'true'

      - name: Approve ignored build scripts
        run: pnpm config set auto-install-peers true && (pnpm approve-builds 2>/dev/null || true)
        continue-on-error: true

      - name: Rebuild sharp manually
        run: |
          cd node_modules/.pnpm/sharp@0.32.6/node_modules/sharp
          npm run install
        env:
          SHARP_IGNORE_GLOBAL_LIBVIPS: 1

      - name: Build site (validates internal links and anchors)
        run: pnpm build

      - name: Check links in built HTML
        uses: lycheeverse/lychee-action@v1
        with:
          args: |
            --exclude "localhost"
            --verbose
            --no-progress
            --exclude-mail
            --max-concurrency 4
            --retry-wait-time 2
            --timeout 20
            build/**/*.html
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
