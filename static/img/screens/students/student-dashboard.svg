<svg width="375" height="667" xmlns="http://www.w3.org/2000/svg">
  <rect width="375" height="667" fill="#f5f7fa"/>
  <!-- Header -->
  <rect width="375" height="80" fill="#4299e1"/>
  <circle cx="30" cy="40" r="20" fill="white" opacity="0.9"/>
  <text x="60" y="38" font-family="Arial, sans-serif" font-size="14" fill="white">Hello, Student</text>
  <text x="60" y="55" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.9">Class 10-A</text>
  <!-- Timetable Card -->
  <rect x="15" y="100" width="345" height="100" rx="8" fill="white" stroke="#e1e8ed" stroke-width="1"/>
  <text x="25" y="125" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a202c">Today's Timetable</text>
  <text x="25" y="150" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">9:00 AM - Mathematics</text>
  <text x="25" y="170" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">10:30 AM - English</text>
  <text x="25" y="190" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">12:00 PM - Science</text>
  <!-- Assignments Card -->
  <rect x="15" y="215" width="345" height="90" rx="8" fill="white" stroke="#e1e8ed" stroke-width="1"/>
  <text x="25" y="240" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a202c">Pending Assignments</text>
  <rect x="25" y="250" width="325" height="45" rx="4" fill="#fff5f5" stroke="#fc8181" stroke-width="1"/>
  <text x="35" y="270" font-family="Arial, sans-serif" font-size="12" fill="#c53030">Math Homework - Due Tomorrow</text>
  <text x="35" y="287" font-family="Arial, sans-serif" font-size="11" fill="#e53e3e">⚠ Urgent</text>
  <!-- Announcements -->
  <rect x="15" y="320" width="345" height="80" rx="8" fill="white" stroke="#e1e8ed" stroke-width="1"/>
  <text x="25" y="345" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#1a202c">Announcements</text>
  <text x="25" y="368" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">📢 School Holiday - Monday</text>
  <text x="25" y="388" font-family="Arial, sans-serif" font-size="12" fill="#4a5568">📚 Library Timings Updated</text>
  <!-- Bottom Navigation -->
  <rect y="617" width="375" height="50" fill="white" stroke="#e1e8ed" stroke-width="1"/>
  <text x="50" y="645" font-family="Arial, sans-serif" font-size="10" fill="#4299e1" text-anchor="middle">🏠 Home</text>
  <text x="137" y="645" font-family="Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">📝 Assignments</text>
  <text x="237" y="645" font-family="Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">📊 Results</text>
  <text x="325" y="645" font-family="Arial, sans-serif" font-size="10" fill="#718096" text-anchor="middle">⚙️ More</text>
</svg>
