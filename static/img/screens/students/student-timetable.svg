<svg width="800" height="600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#f5f7fa"/>
  <text x="50" y="50" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#1a202c">Weekly Timetable</text>
  <text x="50" y="75" font-family="Arial, sans-serif" font-size="14" fill="#718096">Class 10-A | Session 2024-25</text>
  <!-- Header Row -->
  <rect x="50" y="100" width="700" height="40" fill="#4299e1"/>
  <text x="90" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Time</text>
  <text x="200" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Monday</text>
  <text x="320" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Tuesday</text>
  <text x="440" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Wednesday</text>
  <text x="560" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Thursday</text>
  <text x="680" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">Friday</text>
  <!-- Time slots -->
  <rect x="50" y="140" width="700" height="60" fill="white" stroke="#e1e8ed" stroke-width="1"/>
  <text x="60" y="175" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">9:00-10:00</text>
  <rect x="150" y="145" width="100" height="50" rx="4" fill="#e6fffa" stroke="#38b2ac" stroke-width="1"/>
  <text x="200" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#234e52" text-anchor="middle">Math</text>
  <text x="200" y="180" font-family="Arial, sans-serif" font-size="9" fill="#2c7a7b" text-anchor="middle">Room 201</text>
  <rect x="270" y="145" width="100" height="50" rx="4" fill="#fef5e7" stroke="#d69e2e" stroke-width="1"/>
  <text x="320" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#744210" text-anchor="middle">English</text>
  <text x="320" y="180" font-family="Arial, sans-serif" font-size="9" fill="#975a16" text-anchor="middle">Room 105</text>
  <rect x="390" y="145" width="100" height="50" rx="4" fill="#e6f7ff" stroke="#3182ce" stroke-width="1"/>
  <text x="440" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#1e4e8c" text-anchor="middle">Science</text>
  <text x="440" y="180" font-family="Arial, sans-serif" font-size="9" fill="#2c5282" text-anchor="middle">Lab 1</text>
  <rect x="510" y="145" width="100" height="50" rx="4" fill="#fce7f3" stroke="#d53f8c" stroke-width="1"/>
  <text x="560" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#702459" text-anchor="middle">History</text>
  <text x="560" y="180" font-family="Arial, sans-serif" font-size="9" fill="#97266d" text-anchor="middle">Room 304</text>
  <rect x="630" y="145" width="100" height="50" rx="4" fill="#e6fffa" stroke="#38b2ac" stroke-width="1"/>
  <text x="680" y="165" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#234e52" text-anchor="middle">Math</text>
  <text x="680" y="180" font-family="Arial, sans-serif" font-size="9" fill="#2c7a7b" text-anchor="middle">Room 201</text>
  <!-- More rows placeholder -->
  <rect x="50" y="200" width="700" height="60" fill="white" stroke="#e1e8ed" stroke-width="1"/>
  <text x="60" y="235" font-family="Arial, sans-serif" font-size="11" fill="#4a5568">10:15-11:15</text>
