<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
  <rect width="800" height="600" fill="#f8f9fa"/>
  <rect x="0" y="0" width="800" height="60" fill="#0d6efd"/>
  <text x="60" y="38" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">← Report an Issue</text>
  <rect x="100" y="90" width="600" height="450" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <text x="400" y="130" font-family="Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#212529">What type of issue?</text>
  <rect x="130" y="160" width="540" height="60" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="160" cy="190" r="8" fill="#fff" stroke="#ced4da" stroke-width="2"/>
  <text x="185" y="197" font-family="Arial, sans-serif" font-size="15" fill="#212529">🚗 Vehicle Problem</text>
  <rect x="130" y="235" width="540" height="60" rx="6" fill="#e7f1ff" stroke="#0d6efd" stroke-width="2"/>
  <circle cx="160" cy="265" r="8" fill="#0d6efd" stroke="#0d6efd" stroke-width="2"/>
  <circle cx="160" cy="265" r="4" fill="#ffffff"/>
  <text x="185" y="272" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#0d6efd">🛣️ Route Issue (Traffic/Road)</text>
  <rect x="130" y="310" width="540" height="60" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="160" cy="340" r="8" fill="#fff" stroke="#ced4da" stroke-width="2"/>
  <text x="185" y="347" font-family="Arial, sans-serif" font-size="15" fill="#212529">👦 Student Issue</text>
  <rect x="130" y="385" width="540" height="60" rx="6" fill="#f8f9fa" stroke="#dee2e6" stroke-width="1"/>
  <circle cx="160" cy="415" r="8" fill="#fff" stroke="#ced4da" stroke-width="2"/>
  <text x="185" y="422" font-family="Arial, sans-serif" font-size="15" fill="#212529">📋 Other</text>
  <rect x="130" y="465" width="540" height="55" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="145" y="498" font-family="Arial, sans-serif" font-size="13" fill="#6c757d">Describe the issue...</text>
  <rect x="400" y="545" width="270" height="45" rx="6" fill="#dc3545"/>
  <text x="535" y="573" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Submit Report</text>
</svg>