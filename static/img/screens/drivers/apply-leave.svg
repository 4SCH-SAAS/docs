  <text x="145" y="168" font-family="Arial, sans-serif" font-size="14" fill="#212529">Sick Leave ▼</text>
  <text x="130" y="210" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">Start Date</text>
  <rect x="130" y="220" width="260" height="45" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
  <text x="145" y="248" font-family="Arial, sans-serif" font-size="14" fill="#212529">Feb 20, 2026 📅</text>
  <text x="410" y="210" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">End Date</text>
  <rect x="410" y="220" width="260" height="45" rx="4" fill="#f8f9fa" stroke="#ced4da" stroke-width="1"/>
