  <rect x="100" y="90" width="600" height="450" rx="8" fill="#ffffff" stroke="#dee2e6" stroke-width="2"/>
  <text x="130" y="130" font-family="Arial, sans-serif" font-size="14" fill="#6c757d">Leave Type</text>
