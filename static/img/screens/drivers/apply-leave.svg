  <text x="145" y="465" font-family="Arial, sans-serif" font-size="13" fill="#664d03">💡 Your request will be sent to the administrator for approval.</text>
  <text x="145" y="485" font-family="Arial, sans-serif" font-size="12" fill="#997404">Replacement driver will be arranged upon approval.</text>
  <rect x="130" y="515" width="540" height="50" rx="6" fill="#0d6efd"/>
  <text x="400" y="546" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" fill="#ffffff">Submit Leave Request</text>
