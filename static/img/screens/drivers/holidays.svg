  <text x="95" y="222" font-family="Arial, sans-serif" font-size="12" fill="#0f5132">No transportation service required</text>
  <rect x="20" y="260" width="760" height="50" rx="6" fill="#e7f1ff" stroke="#0d6efd" stroke-width="1"/>
