  <text x="40" y="537" font-family="Arial, sans-serif" font-size="13" fill="#664d03">💡 Regular service resumes March 22, 2026</text>
  <text x="40" y="557" font-family="Arial, sans-serif" font-size="12" fill="#997404">Check your schedule for any route changes after the break</text>
